name: Conservar recursos de fondos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Copiar recursos comprobados a su borrador privado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "fouronesys/slate"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh release view slate-backgrounds-2 --json isDraft --jq .isDraft)" = "true"
          mkdir -p generated-artifacts/asset-transfer
          python3 - <<'PY'
          import json, subprocess, base64, hashlib, pathlib
          root = pathlib.Path("generated-artifacts/asset-transfer")
          blobs = {
            "slate-dark-1080.mp4": "facca8e72f8a4151517e2dad823e0bd6a2dad0e4",
            "slate-dark-1080.jpg": "95eaa673d82ec27471d72517e85c4e3edf2be16a",
            "slate-light-1080.mp4": "eb39de338498b506f4b42ddf009792d53550fc23",
            "slate-light-1080.jpg": "6c2081dae59586b6f119191b6e4863b7f07c322a",
          }
          manifest = json.loads(pathlib.Path("artifacts/chromium-browser/src/default-backgrounds.json").read_text())
          for asset in manifest["assets"]:
              name = asset["name"]
              response = subprocess.check_output(["gh", "api", "repos/fouronesys/slate/git/blobs/" + blobs[name]])
              data = base64.b64decode(json.loads(response)["content"])
              assert len(data) == asset["bytes"] and hashlib.sha256(data).hexdigest() == asset["sha256"], name
              (root / name).write_bytes(data)
          PY
          gh release upload slate-backgrounds-2 generated-artifacts/asset-transfer/*.mp4 generated-artifacts/asset-transfer/*.jpg
          node artifacts/chromium-browser/scripts/prepare-backgrounds.cjs
